<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockchain технологиясы · ALPHA</title><style>*{box-sizing:border-box}body{margin:0;background:#090e26;color:#f5f9ff;font-family:Arial,Helvetica,sans-serif}.deck{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.slide{position:relative;width:min(1200px,100%);min-height:620px;padding:45px 55px 90px;background:radial-gradient(circle at 94% 12%,#32205e 0,transparent 26%),linear-gradient(135deg,#0b1030,#131b40);border-left:8px solid #1fdcee;border-radius:22px;box-shadow:0 20px 80px #0009}.kicker{color:#1fdcee;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px}.title{font-size:clamp(30px,4.3vw,56px);line-height:1.12;margin:28px 0 14px}.sub{color:#b2c2dc;font-size:20px;max-width:850px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:55px}.card{background:#19244c;border-radius:16px;padding:24px;border-top:5px solid #1fdcee;min-height:170px}.card:nth-child(2){border-color:#925bff}.card:nth-child(3){border-color:#ff4b97}.card:nth-child(4){border-color:#ffcf5b}.card h2{font-size:22px;margin:0 0 16px}.card p{font-size:17px;line-height:1.55;color:#cbd8ef}.footer{position:absolute;bottom:24px;left:55px;right:55px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #925bff;padding-top:18px;color:#b2c2dc;font-size:13px}.controls{display:flex;gap:12px}.controls button{background:#1fdcee;color:#091027;border:0;border-radius:10px;padding:10px 17px;font-size:17px;font-weight:bold;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}@media(max-width:600px){.deck{padding:8px}.slide{padding:25px 18px 100px;min-height:95vh}.cards{margin-top:28px}.footer{left:18px;right:18px;flex-wrap:wrap;gap:10px}.card{min-height:0}}</style></head><body><div class="deck"><main class="slide"><div class="kicker" id="k"></div><h1 class="title" id="t"></h1><p class="sub" id="s"></p><div class="cards" id="cards"></div><footer class="footer"><span>ALPHA / ИНФОРМАТИКА / 11-СЫНЫП</span><div class="controls"><button id="prev" aria-label="Алдыңғы">←</button><span id="count"></span><button id="next" aria-label="Келесі">→</button></div></footer></main></div><script>const slides=[{"k":"§59–60 • Цифрлық сауаттылық","t":"BLOCKCHAIN ТЕХНОЛОГИЯСЫ","sub":"Ақпаратты орталықсыздандырылған сақтау және қорғау технологиялары","items":[["ДЕРЕКТЕР","СЕНІМ","КРИПТОГРАФИЯ"]]},{"k":"Негізгі ұғымдар","t":"Блокчейннің 3 негізгі тірегі","sub":"Блокчейн — орталықсыздандырылған деректер тізілімі.","items":[["Орталықсыздандыру","Ақпарат бір ғана серверде емес, желіге қатысушы компьютерлерде сақталады."],["Өзгермейтіндік","Блоктар криптографиялық хэштермен байланысады. Бұрынғы жазбаны өзгерту өте қиын."],["Ашықтық пен сенім","Қатысушылар операциялар тарихын тексеріп, жазбаларды салыстыра алады."]]},{"k":"Жұмыс істеу механизмі","t":"Транзакциядан блокқа дейін","sub":"Блокчейн жүйесіндегі негізгі үш кезең.","items":[["1-ҚАДАМ · Транзакция","Пайдаланушы операция бастайды. Ақпарат цифрлық қолтаңбамен расталып, P2P желісіне жіберіледі."],["2-ҚАДАМ · Тексеру және блок","Нодалар операцияны тексереді. Мақұлданған транзакциялар жаңа блокқа жинақталады."],["3-ҚАДАМ · Тізбекке қосу","Жаңа блок алдыңғы блоктың хэшін қамтып, тізбекке қосылады. Желі жаңартылады."]]},{"k":"Артықшылықтар","t":"Неге блокчейн маңызды?","sub":"Технологияның негізгі мүмкіндіктері.","items":[["Қауіпсіздік","Криптографиялық тәсілдер жазбаларды қорғауға көмектеседі."],["P2P транзакциялар","Кейбір операцияларда делдалдарға тәуелділікті азайтады."],["Қадағалау","Операциялар тарихын тексеру мен аудит жүргізуді жеңілдетеді."],["Смарт-контракт","Белгіленген шарт орындалғанда код автоматты түрде әрекет етеді."]]},{"k":"Практикалық қолдану","t":"Блокчейн қайда қолданылады?","sub":"Қаржыдан мемлекеттік реестрлерге дейін.","items":[["Қаржы және банк","Криптовалюталар, халықаралық аударымдар, цифрлық валюталар."],["Смарт-контракттар","Келісім шарттары орындалғанда бағдарламалық код іске қосылады."],["Логистика","Тауардың шығу тегі мен жеткізу тізбегін қадағалау."],["Мемлекеттік реестрлер","Меншік, құжаттар және цифрлық жазбаларды тіркеу мүмкіндіктері."]]},{"k":"Қорытынды және бекіту","t":"Біліміңді тексер!","sub":"§59–60. Blockchain технологиясы","items":[["НЕГІЗГІ ТҮЙІНДЕР","Үлестірілген тізілім • Криптографиялық хэштеу • P2P операциялар • Смарт-контракттар"],["БЕКІТУ СҰРАҚТАРЫ","Орталықтандырылған базадан айырмасы неде? Блоктар арасындағы хэш қандай рөл атқарады? Смарт-контракт қайда қолданылады? Неге бұрынғы жазбаны өзгерту қиын?"]]}];let i=0;function render(){const d=slides[i];document.getElementById('k').textContent=d.k;document.getElementById('t').textContent=d.t;document.getElementById('s').textContent=d.sub;document.getElementById('cards').replaceChildren(...d.items.map(([h,b])=>{const c=document.createElement('article');c.className='card';const t=document.createElement('h2');t.textContent=h;const p=document.createElement('p');p.textContent=b||'';c.append(t,p);return c}));document.getElementById('count').textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1}document.getElementById('prev').onclick=()=>{i=Math.max(0,i-1);render()};document.getElementById('next').onclick=()=>{i=Math.min(slides.length-1,i+1);render()};window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});render();</script></body></html>
