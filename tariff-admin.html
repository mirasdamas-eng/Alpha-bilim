<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALPHA Admin · Тарифтер</title><style>body{margin:0;background:#f3f5fc;color:#1a2441;font:16px system-ui}.wrap{max-width:850px;margin:40px auto;padding:18px}.card{background:white;padding:26px;border-radius:20px;margin:16px 0;box-shadow:0 12px 35px #16214b10}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d8ddef;margin:5px 0}input{width:calc(100% - 28px)}button{background:#6058e9;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}.hidden{display:none}.entry{border-top:1px solid #e6e9f2;padding:15px 0}.entry select{max-width:220px}.entry input{width:90px}.muted{color:#69758b}a{color:#6058e9}</style><div class="wrap"><p><a href="./">← ALPHA сайты</a></p><h1>🔐 ALPHA ADMIN</h1><div class="card" id="login"><h2>Әкімші ретінде кіру</h2><form id="loginForm"><input id="email" type="email" placeholder="Email" required autocomplete="username"><input id="password" type="password" placeholder="Құпиясөз" required autocomplete="current-password"><button>Кіру</button></form><p id="loginMessage" class="muted"></p></div><div id="dashboard" class="hidden"><div class="card"><h2>Тарифтерді басқару</h2><p id="identity" class="muted"></p><button id="logout">Шығу</button></div><div class="card"><h3>Оқушыны іздеу</h3><form id="searchForm"><input id="search" minlength="3" placeholder="Аты немесе телефон нөмірі" required><button>Іздеу</button></form><p id="message" class="muted"></p><div id="results"></div></div><div class="card"><b>Free</b> — тегін сабақтар және қарапайым тесттер.<p><b>Online Start</b> — 7 000 ₸/ай; <b>Online Plus</b> — 12 000 ₸/ай.</p><p class="muted">Тарифті қолмен тағайындау автоматты төлемді білдірмейді.</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://iuchrzphazitgycomtxv.supabase.co','sb_publishable_5_sK62cUTvvL--2mphuExQ_jroU-tRy');const $=id=>document.getElementById(id);
async function check(){const {data:{user}}=await sb.auth.getUser();const {data:admin}=user?await sb.rpc('is_alpha_admin'):{data:false};$('login').classList.toggle('hidden',!!admin);$('dashboard').classList.toggle('hidden',!admin);if(admin)$('identity').textContent=user.email;else if(user)$('loginMessage').textContent='Бұл аккаунтқа әкімші құқығы берілмеген.'}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMessage').textContent=error?error.message:'';if(!error)await check()};
$('logout').onclick=async()=>{await sb.auth.signOut();await check()};
$('searchForm').onsubmit=async e=>{e.preventDefault();$('results').replaceChildren();$('message').textContent='Ізделуде...';const {data,error}=await sb.rpc('alpha_admin_find_students',{p_search:$('search').value.trim()});if(error){$('message').textContent=error.message;return}$('message').textContent=data.length+' оқушы табылды';for(const u of data){const row=document.createElement('div');row.className='entry';const name=document.createElement('p');name.textContent=[u.full_name,u.grade,u.phone].filter(Boolean).join(' · ');const plan=document.createElement('select');[['free','Free'],['start','Online Start'],['plus','Online Plus']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;plan.append(o)});const days=document.createElement('input');days.type='number';days.min='1';days.max='365';days.value='30';days.title='Күн саны';const save=document.createElement('button');save.textContent='Тарифті қосу';save.onclick=async()=>{const n=Number(days.value);if(!Number.isInteger(n)||n<1||n>365){$('message').textContent='1–365 күн таңдаңыз';return}if(!confirm('Осы оқушыға тариф тағайындау керек пе?'))return;save.disabled=true;const {error}=await sb.rpc('alpha_admin_set_plan',{p_user_id:u.id,p_plan_key:plan.value,p_days:n});save.disabled=false;if(error){$('message').textContent='Сақтау қатесі: '+error.message;return}const {data:verified,error:verifyError}=await sb.from('alpha_entitlements').select('plan_key,expires_at').eq('user_id',u.id).gt('expires_at',new Date().toISOString()).order('expires_at',{ascending:false}).limit(1);if(verifyError){$('message').textContent='Сақтау сұрауы өтті, бірақ тексеру мүмкін болмады: '+verifyError.message;return}const active=verified?.[0]?.plan_key||'free';$('message').textContent=active===plan.value?'✓ Тариф сақталды: '+active:'⚠ Тарифті тексеру қажет: күтілген '+plan.value+', анықталған '+active};row.append(name,plan,days,save);$('results').append(row)}};
sb.auth.onAuthStateChange(()=>setTimeout(check,0));check();
</script></html>
